name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project GalaxyKeyboard.xcodeproj \
            -scheme GalaxyKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GalaxyKeyboard.app Payload/
          ls Payload/GalaxyKeyboard.app/PlugIns
          zip -qry GalaxyKeyboard.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyKeyboard-ipa
          path: GalaxyKeyboard.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GalaxyKeyboard build ${{ github.run_number }}
          body: 서명되지 않은 IPA입니다. Sideloadly나 AltStore로 내 Apple ID로 서명해서 설치하세요.
          files: GalaxyKeyboard.ipa
